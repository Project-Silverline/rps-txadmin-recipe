$engine: 3
$minFxVersion: 12913
$onesync: "on"
name: RPS Framework
version: 0.3.3
author: RPS
description: |
  Lightweight roleplay framework: characters, money, jobs and permissions (rps_core),
  with ox_inventory and illenium-appearance. rps_ambulance will be added once it's published.

tasks:
  # --- Default CFX resources (chat, spawnmanager, ...) -------------------------
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: c6afa3909c763e3327ed76825e78453286c99f05
    subpath: resources
    dest: ./resources/[cfx-default]

  # --- Overextended (pinned release builds) ------------------------------------
  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/download/v2.14.3/oxmysql.zip
    path: ./tmp/oxmysql.zip
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[ox]

  - action: download_file
    url: https://github.com/overextended/ox_lib/releases/download/v3.40.0/ox_lib.zip
    path: ./tmp/ox_lib.zip
  - action: unzip
    src: ./tmp/ox_lib.zip
    dest: ./resources/[ox]

  - action: download_file
    url: https://github.com/overextended/ox_inventory/releases/download/v2.48.0/ox_inventory.zip
    path: ./tmp/ox_inventory.zip
  - action: unzip
    src: ./tmp/ox_inventory.zip
    dest: ./resources/[ox]

  # --- illenium-appearance (pinned release build) ------------------------------
  - action: download_file
    url: https://github.com/iLLeniumStudios/illenium-appearance/releases/download/v5.7.0/illenium-appearance.zip
    path: ./tmp/illenium-appearance.zip
  - action: unzip
    src: ./tmp/illenium-appearance.zip
    dest: ./resources/[standalone]

  # --- rps_core (the repo root is the resource) --------------------------------
  - action: download_github
    src: https://github.com/Project-Silverline/rps_core
    ref: main
    dest: ./resources/[rps]/rps_core

  # --- install/ (SQL, bridges, docs) from the recipe repo -----------------------
  - action: download_github
    src: https://github.com/Project-Silverline/rps-txadmin-recipe
    ref: main
    subpath: install
    dest: ./tmp/install

  # --- ox_inventory: rps bridge, table mapping, medkit item --------------------
  - action: copy_path
    src: ./tmp/install/ox_inventory
    dest: ./resources/[ox]/ox_inventory

  - action: replace_string
    mode: literal
    file: ./resources/[ox]/ox_inventory/modules/mysql/server.lua
    search: 'elseif shared.framework == ''qbx'' then'
    replace: |-
      elseif shared.framework == 'rps' then
              playerTable = 'characters'
              playerColumn = 'id'
              vehicleTable = 'rps_vehicles'
              vehicleColumn = 'id'
          elseif shared.framework == 'qbx' then

  # medkit is used by rps_ambulance; until that's deployed the item exists but does nothing
  - action: replace_string
    mode: literal
    file: ./resources/[ox]/ox_inventory/data/items.lua
    search: '[''bandage''] = {'
    replace: |-
      ['medkit'] = {
              label = 'Medkit',
              weight = 500,
              stack = true,
              close = true,
              description = 'Used by paramedics to revive unconscious patients',
              client = {
                  export = 'rps_ambulance.medkit',
              },
          },

          ['bandage'] = {

  # --- illenium-appearance: rps bridge, manifest entries, EMS changing room ----
  - action: copy_path
    src: ./tmp/install/illenium-appearance
    dest: ./resources/[standalone]/illenium-appearance

  - action: replace_string
    mode: literal
    file: ./resources/[standalone]/illenium-appearance/fxmanifest.lua
    search: '"client/framework/ox/main.lua",'
    replace: |-
      "client/framework/ox/main.lua",
        "client/framework/rps/main.lua",

  - action: replace_string
    mode: literal
    file: ./resources/[standalone]/illenium-appearance/fxmanifest.lua
    search: '"server/framework/ox/main.lua",'
    replace: |-
      "server/framework/ox/main.lua",
        "server/framework/rps/main.lua",

  - action: replace_string
    mode: literal
    file: ./resources/[standalone]/illenium-appearance/shared/config.lua
    search: 'Config.ClothingRooms = {'
    replace: |-
      Config.ClothingRooms = {
          {
              job = "ambulance",
              coords = vector4(334.0, -1402.5, 32.5, 50.0),
              size = vector3(3, 3, 3),
              rotation = 50,
              usePoly = false,
          },

  # --- ox.cfg (Overextended settings, exec'd from server.cfg) --------------------
  - action: write_file
    file: ./ox.cfg
    data: |
      ## Overextended settings for the RPS framework (exec'd from server.cfg)

      ## ox_inventory (setr, not set: clients need these too)
      setr inventory:framework "rps"
      setr inventory:slots 40
      setr inventory:weight 30000

      ## ox_lib runs add_principal/add_ace for RPS groups and commands; it needs permission
      add_ace resource.ox_lib command.add_ace allow
      add_ace resource.ox_lib command.remove_ace allow
      add_ace resource.ox_lib command.add_principal allow
      add_ace resource.ox_lib command.remove_principal allow

  # --- server.cfg (written from this recipe, then filled in by txAdmin) ----------
  - action: write_file
    file: ./server.cfg
    data: |
      ## Deployed by txAdmin with the {{recipeName}} recipe ({{recipeVersion}})

      {{serverEndpoints}}

      sv_maxclients {{maxClients}}
      set steam_webApiKey "none"
      sets tags "roleplay, rps"
      sets locale "en-US"

      sv_hostname "{{serverName}}"
      sets sv_projectName "{{serverName}}"
      sets sv_projectDesc "RPS roleplay server"

      ## Database
      set mysql_connection_string "{{dbConnectionString}}"

      ## Overextended settings (must run before ox_inventory starts)
      exec ox.cfg

      ## Default CFX resources
      # chat ships with the server build; sessionmanager and hardcap are no longer
      # part of cfx-server-data, so they aren't ensured here.
      set resources_useSystemChat true
      ensure mapmanager
      ensure chat
      ensure spawnmanager
      ensure basic-gamemode

      # rps_core only sets state bags from the server, so clients can be locked out
      setr sv_stateBagStrictMode true

      ## Dependencies
      ensure oxmysql
      ensure ox_lib

      ## RPS (order matters: ox_inventory and illenium-appearance start after rps_core)
      ensure rps_core
      ensure ox_inventory
      ensure illenium-appearance

      ## Permissions
      add_ace group.admin command allow
      add_ace group.admin command.quit deny

      # txAdmin master account (added by the deployer)
      {{addPrincipalsMaster}}

      sv_licenseKey "{{svLicense}}"

  - action: replace_string
    mode: all_vars
    file: ./server.cfg

  # --- Database ------------------------------------------------------------------
  - action: connect_database

  - action: query_database
    file: ./tmp/install/sql/install.sql

  # --- Clean-up -----------------------------------------------------------------
  - action: remove_path
    path: ./tmp
